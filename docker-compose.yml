services:
  postgres:
    image: postgres:16-alpine
    container_name: hive-freelance-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: hive_freelance
    volumes:
      - hive_freelance_pg:/var/lib/postgresql/data
      # First-volume init only — also run: npm run db:bootstrap-haf
      - ./infra/haf-local/docker-init:/docker-entrypoint-initdb.d:ro
      - ./infra/haf-local/schema.sql:/haf-schema/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive_freelance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hive_freelance_pg:
