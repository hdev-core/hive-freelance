name: Deploy API to server

on:
  push:
    branches:
      - develop
    paths:
      # Only redeploy when something that actually affects the running
      # server changes — same reasoning as build-gate.yml's per-workspace
      # jobs, applied to deploy instead of build. Avoids a pointless
      # restart (and a few seconds of downtime) on, say, a docs-only or
      # apps/web-only commit.
      - "apps/api/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/hive/**"
      - "apps/provisioner/**"
      - "package-lock.json"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          SERVER_HOST="62.238.101.245"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes deploy@"$SERVER_HOST" '
            set -e
            cd ~/hive-freelance

            # --hard is deliberate: the server checkout should never have
            # local changes of its own to preserve — this is a pure
            # deploy target, not somewhere anyone edits directly.
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop

            npm ci

            npm run build -w @hive-freelance/shared
            npm run build -w @hive-freelance/db
            npm run build -w @hive-freelance/hive
            npm run build -w @hive-freelance/provisioner
            npm run build -w @hive-freelance/api

            cd packages/db
            npx prisma migrate deploy
            cd ../..

            pm2 restart hive-freelance-api

            sleep 2
            curl -sf http://localhost:4000/health || (echo "Health check failed after deploy" && exit 1)
          '