name: Deploy API to server

on:
  push:
    branches:
      - develop
    paths:
      # Only redeploy when something that actually affects the running
      # server changes. root package.json is included alongside the
      # lockfile now, since a workspace/script change there alone
      # wouldn't otherwise trigger a deploy.
      - "apps/api/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "packages/hive/**"
      - "apps/provisioner/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-api.yml"

# Job never checks out the repo or calls any API of its own — it only
# opens an SSH connection and hands the remote shell a fixed script, so
# it needs no permissions at all.
permissions: {}

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Host key pinned once, captured out-of-band via ssh-keyscan on
          # 2026-08-14 — not re-fetched on every run. ssh-keyscan on every
          # run is trust-on-first-use where "first" is every time, which
          # authenticates nothing. StrictHostKeyChecking=yes below means
          # this fails closed if the server's key ever actually changes,
          # rather than silently trusting whatever's presented.
          #
          # The whole known_hosts line (host + key) lives in a secret,
          # not hardcoded here — the public key itself isn't sensitive,
          # but the server address is, and this repo is public. Storing
          # the complete line as one secret (rather than reconstructing
          # it from DEPLOY_HOST + a literal key) also closes a
          # correctness risk: if DEPLOY_HOST were ever a hostname rather
          # than the exact string this entry keys on, a reconstructed
          # entry wouldn't match and every run would fail closed with no
          # obvious cause.
          echo "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy@"$SERVER_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" << 'REMOTE_SCRIPT'
          set -e
          cd ~/hive-freelance

          # Deploy the exact commit that triggered this run, not "whatever
          # develop's tip happens to be by the time this SSH session
          # runs" — under concurrency (two merges close together), the
          # second run's "git reset --hard origin/develop" would silently
          # deploy the later commit even for the run the Actions UI shows
          # green against the earlier one.
          git fetch origin develop
          git checkout --detach "$DEPLOY_SHA"

          npm ci

          npm run build -w @hive-freelance/shared
          npm run build -w @hive-freelance/db
          npm run build -w @hive-freelance/hive
          npm run build -w @hive-freelance/provisioner
          npm run build -w @hive-freelance/api

          # Backup before every migration attempt, not just on failure —
          # a migrate deploy that gets killed mid-way (e.g. this job
          # hitting its timeout) can leave Prisma's migration history in
          # a failed state (P3009), which then blocks every future
          # migrate deploy until someone manually resolves it. A fresh
          # dump right before the attempt means there's always a known-
          # good point to restore from regardless of how it fails.
          # Kept as the 5 most recent; older ones are pruned so this
          # doesn't grow unbounded on a small box.
          #
          # Uses PG_DUMP_URL, not DIRECT_URL — despite the name,
          # DIRECT_URL is still Supavisor's session-mode pooler, and
          # pg_dump/psql fail to connect through it with a nonsensical
          # "database does not exist" error (verified directly; Prisma's
          # own connector handles the same pooler fine, so this is
          # specific to raw libpq-based tools). PG_DUMP_URL points at
          # Supabase's true direct (non-pooled) host instead. That host
          # is IPv6-only and unreachable from some home networks, but
          # this runs from the server's own datacenter connection, where
          # it works.
          #
          # PGPASSWORD, not embedded in the URL — passing a URI with the
          # password inline puts it in argv, readable by any local user
          # via `ps aux` for the duration of the dump. PG_DUMP_URL holds
          # no password; PG_DUMP_PASSWORD supplies it via libpq's
          # PGPASSWORD environment variable instead, which pg_dump reads
          # without ever putting it on the command line.
          mkdir -p ~/db-backups
          BACKUP_FILE=~/db-backups/pre-migrate-$(date +%Y%m%d-%H%M%S).sql
          set -a
          source packages/db/.env
          set +a
          PGPASSWORD="$PG_DUMP_PASSWORD" pg_dump "$PG_DUMP_URL" > "$BACKUP_FILE"
          ls -t ~/db-backups/*.sql | tail -n +6 | xargs -r rm --

          npm run migrate -w @hive-freelance/db

          pm2 restart hive-freelance-api

          healthy=false
          for i in $(seq 1 10); do
            if curl -s http://localhost:4000/health | grep -q "\"ok\":true"; then
              healthy=true
              break
            fi
            sleep 3
          done
          if [ "$healthy" != true ]; then
            echo "Health check failed after deploy (10 attempts, 3s apart)"
            echo "Most recent backup, if a manual restore is needed: $BACKUP_FILE"
            exit 1
          fi
          REMOTE_SCRIPT

      - name: Clean up deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key